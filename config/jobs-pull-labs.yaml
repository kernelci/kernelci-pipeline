  ltp-math-pull-labs:
    <<: *ltp-job-pull-labs
    params:
      <<: *ltp-params-pull-labs
      tst_cmdfiles: "math"

  ltp-mm-pull-labs:
    <<: *ltp-job-pull-labs
    params:
      <<: *ltp-params-pull-labs
      tst_cmdfiles: "mm"

  ltp-nptl-pull-labs:
    <<: *ltp-job-pull-labs
    params:
