name: Sync stable branches

on:
  schedule:
    # Run weekly on Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Check for updates
        id: check
        run: |
          python tools/sync_stable_branches.py --dry-run 2>&1 | tee "$RUNNER_TEMP/sync-output.txt"
          if grep -q "Config is already up to date" "$RUNNER_TEMP/sync-output.txt"; then
            echo "needs_update=false" >> $GITHUB_OUTPUT
          else
            echo "needs_update=true" >> $GITHUB_OUTPUT
          fi

      - name: Apply updates
        if: steps.check.outputs.needs_update == 'true'
        run: python tools/sync_stable_branches.py

      - name: Create Pull Request
        if: steps.check.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "config/trees: sync stable branches with kernel.org"
          title: "config/trees: sync stable branches with kernel.org"
          body: |
            Automated sync of stable-rc.yaml and stable.yaml with current kernel.org releases.

            This PR was created automatically by the sync-stable-branches workflow.
          branch: sync-stable-branches
          delete-branch: true
