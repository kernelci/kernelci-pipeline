name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-slim

    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install lint tooling
        run: |
          python --version
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff pre-commit hooks
        run: |
          pre-commit run --all-files --show-diff-on-failure

  validate:
    runs-on: ubuntu-slim
    strategy:
      matrix:
        python-version:
          - '3.9'
          - '3.10'
          - '3.13'

    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install validation dependencies
        run: |
          python --version
          python -m pip install --upgrade pip
          pip install pyyaml PyJWT toml jsonschema pytest

      - name: Run basic YAML validation
        run: |
          python tests/validate_yaml.py

      - name: Validate hardware registry
        run: |
          python tests/hw_reg_checker.py
          python -m pytest tests/test_hw_reg_checker.py -v

      - name: Run basic JWT test
        run: |
          python tests/validate_jwt.py
